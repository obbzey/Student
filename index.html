/* ---------- Theme tokens ---------- */
:root {
  --bg: #e8ecf4;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);

@media (prefers-color-scheme: dark) {

}

/* ---------- Base ---------- */
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body { height: 100%; margin: 0; background: var(--bg); font-family: 'Inter', system-ui, sans-serif; }

/* ---------- Phone frame ---------- */
.phone { height: min(800px, 100%); }

/* ---------- Animations ---------- */
@keyframes pulse-ring { 0% { r: 6; opacity: .6; } 100% { r: 18; opacity: 0; } }
.pulse { animation: pulse-ring 1.8s infinite; }

@keyframes slide-up { from { transform: translateY(100%); } to { transform: none; } }
.sheet { animation: slide-up .28s ease-out; }

@keyframes scan-move { 0% { top: 6%; } 100% { top: 92%; } }

  <!-- App code (order matters) -->
  <script>
/* Static data + helpers (no UI here) */
const ROUTES = {
  A: { name: "Route A", label: "Main Gate ↔ Library",  color: "#2563eb", bus: "SH-101", tag: "Peak",              speed: .00006,
       pts: [[20,210],[80,180],[140,150],[200,110],[270,70],[340,50]] },
  B: { name: "Route B", label: "Hostels ↔ Faculty",    color: "#e11d48", bus: "SH-204", tag: "Peak",              speed: .00005,
       pts: [[20,60],[90,90],[150,140],[220,190],[290,200],[340,225]] },
  C: { name: "Route C", label: "Sports Complex Loop",  color: "#059669", bus: "SH-307", tag: "Off-peak · 2× pts", speed: .00004,
       pts: [[50,235],[110,205],[190,175],[250,125],[300,125],[345,150]] },
};
const INITIAL_SEATS = { A: 24, B: 17, C: 9 };   // free seats out of 30
const REDEEM_COST = 400;
const OFF_PEAK_BONUS = 50;
const BOOKING_CUTOFF = 5;   // minutes: reservations close 5 min before departure

/* Point at fraction t (0..1) along a polyline */
function pointAlong(pts, t) {
  const seg = []; let total = 0;
  for (let i = 1; i < pts.length; i++) {
    const d = Math.hypot(pts[i][0] - pts[i-1][0], pts[i][1] - pts[i-1][1]);
    seg.push(d); total += d;
  }
  let dist = t * total;
  for (let i = 0; i < seg.length; i++) {
    if (dist <= seg[i]) {
      const k = dist / seg[i];
      return [pts[i][0] + (pts[i+1][0] - pts[i][0]) * k, pts[i][1] + (pts[i+1][1] - pts[i][1]) * k];
    }
    dist -= seg[i];
  }
  return pts[pts.length - 1];
}

/* Simulated bus progress along its route */
function busProgress(routeKey, busIndex, now) {
  return (now * ROUTES[routeKey].speed * (1 + busIndex * .15) + busIndex * .5 + routeKey.charCodeAt(0) * .13) % 1;
}

/* Arrival status derived from ETA (minutes) */
function etaStatus(m) {
  if (m >= 6) return { label: "On the way",  cls: "bg-blue-100 text-blue-700",       text: `Next bus in ${m} min` };
  if (m >= 2) return { label: "Approaching", cls: "bg-amber-100 text-amber-700",     text: `Next bus in ${m} min` };
  if (m === 1) return { label: "Arriving",   cls: "bg-emerald-100 text-emerald-700", text: "Next bus in 1 min" };
  return        { label: "At stop",          cls: "bg-slate-900 text-white",         text: "Bus is at your stop" };
}

/* Previous trips (seed history for the My Trips screen) */
const PAST_TRIPS = [
  { route: "C", bus: "SH-307", when: "Yesterday 16:20", status: "Completed" },
  { route: "A", bus: "SH-101", when: "Mon 08:30",       status: "Completed" },
];

/* Cancellation window: open until 5 min before departure (1 simulated minute = 2 s, same pace as the bus animation) */
const SIM_MIN_MS = 2000;
function cancelNote(canCancel, minsLeft, paid) {
  if (paid) return "Trip paid and boarded — cancellation is no longer available.";
  if (canCancel) return `Cancellation open for ${Math.max(1, Math.ceil(minsLeft - BOOKING_CUTOFF))} more min (closes 5 min before departure).`;
  return "Cancellation closed — it is only available until 5 minutes before departure.";
}

</script>
  <script>
/* Shared UI primitives */
const { useState, useEffect, useRef } = React;
const html = htm.bind(React.createElement);

/* Lucide icon wrapper */
function Icon({ n, s = 18, c = "" }) {
  const ref = useRef();
  useEffect(() => {
    if (window.lucide && ref.current) {
      ref.current.innerHTML = `<i data-lucide="${n}"></i>`;
      lucide.createIcons({ attrs: { width: s, height: s } });
    }
  }, [n, s]);
  return html`<span ref=${ref} className=${"inline-flex items-center " + c}></span>`;
}

/* Centered modal over the phone screen */
function Modal({ children, onClose }) {
  return html`
    <div className="absolute inset-0 z-30 flex items-center justify-center bg-slate-900/60 p-6" onClick=${onClose}>
      <div className="bg-white rounded-3xl p-6 w-full text-center shadow-2xl" onClick=${e => e.stopPropagation()}>${children}</div>
    </div>`;
}

/* Simulated QR code (seeded pseudo-random pattern + finder squares) */
function QR({ cls = "w-48 h-48" } = {}) {
  const N = 21, cells = []; let seed = 7;
  const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  const isFinder = (x, y) => (x < 8 && y < 8) || (x > 12 && y < 8) || (x < 8 && y > 12);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    let on;
    if (isFinder(x, y)) {
      const fx = x > 12 ? x - 14 : x, fy = y > 12 ? y - 14 : y;
      on = fx < 7 && fy < 7 && (fx == 0 || fx == 6 || fy == 0 || fy == 6 || (fx > 1 && fx < 5 && fy > 1 && fy < 5));
    } else on = rnd() > .5;
    if (on) cells.push(html`<rect key=${x + "-" + y} x=${x} y=${y} width="1" height="1"/>`);
  }
  return html`<svg viewBox="-1 -1 23 23" className=${cls + " mx-auto"} fill="#0f172a">${cells}</svg>`;
}

/* Simulated payment confirmation sound: high BEEP = success, low BUZZ = failure (UC-01 business rule) */
function beep(ok = true) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "square"; o.frequency.value = ok ? 1200 : 220;
    g.gain.value = 0.08; o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + (ok ? 0.25 : 0.5));
  } catch (e) { /* audio not available */ }
}

</script>
  <script>
/* Feature sections: map, payment, rewards, reservation sheet, my trips, QR scanner */

/* 1. Live bus tracking */
function MapCard({ sel, setSel, now, eta, status }) {
  const R = ROUTES[sel];
  return html`
  <div className="relative bg-white px-3 pb-3">
    <div className="flex gap-2 pb-2 overflow-x-auto">
      ${Object.entries(ROUTES).map(([k, r]) => html`
        <button key=${k} onClick=${() => setSel(k)}
          className=${"shrink-0 px-3 py-1.5 rounded-full text-xs font-semibold border transition " + (sel === k ? "text-white border-transparent" : "bg-white text-slate-600 border-slate-200")}
          style=${sel === k ? { background: r.color } : {}}>${r.name}</button>`)}
    </div>
    <div className="rounded-2xl overflow-hidden border border-slate-200 bg-[#eef3ea]">
      <svg viewBox="0 0 360 260" className="w-full block">
        <defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#dfe7da" strokeWidth="1"/></pattern></defs>
        <rect width="360" height="260" fill="url(#grid)"/>
        <rect x="130" y="20" width="60" height="38" rx="6" fill="#d7e3cf"/>
        <rect x="250" y="160" width="70" height="40" rx="6" fill="#d7e3cf"/>
        <rect x="30" y="100" width="50" height="34" rx="6" fill="#d7e3cf"/>
        ${Object.entries(ROUTES).map(([k, r]) => html`
          <polyline key=${k} points=${r.pts.map(p => p.join(",")).join(" ")} fill="none" stroke=${r.color}
            strokeWidth=${sel === k ? 5 : 3} strokeLinecap="round" strokeLinejoin="round"
            opacity=${sel === k ? 1 : .3} strokeDasharray=${sel === k ? "" : "2 6"}/>`)}
        ${Object.entries(ROUTES).map(([k, r]) => [0, 1].map(i => {
          const [x, y] = pointAlong(r.pts, busProgress(k, i, now));
          return html`
            <g key=${k + i} transform=${`translate(${x},${y})`} opacity=${sel === k ? 1 : .5}>
              <circle r="11" fill="white" stroke=${r.color} strokeWidth="3"/>
              <text textAnchor="middle" y="4" fontSize="10" fontWeight="700" fill=${r.color}>${k}</text>
            </g>`;
        }))}
        <circle cx="150" cy="150" r="6" fill="#2563eb" opacity=".5" className="pulse"/>
        <circle cx="150" cy="150" r="7" fill="#2563eb" stroke="white" strokeWidth="3"/>
        <text x="162" y="143" fontSize="10" fontWeight="600" fill="#1e3a8a">You</text>
      </svg>
    </div>
    <div className="flex items-center justify-between mt-3 px-1">
      <div>
        <p className="text-sm font-semibold text-slate-900">${R.name} · ${R.label}</p>
        <p className="text-xs text-slate-500 flex items-center gap-1.5 mt-0.5"><${Icon} n="clock" s=${12}/> ${status.text} · ${R.bus}
          <span className=${"text-[10px] font-bold px-1.5 py-0.5 rounded-full " + status.cls}>${status.label}</span></p>
      </div>
      <span className=${"text-[11px] font-semibold px-2 py-1 rounded-full " + (sel === "C" ? "bg-emerald-100 text-emerald-700" : "bg-slate-100 text-slate-600")}>${R.tag}</span>
    </div>
  </div>`;
}

/* 3. Payment method toggle */
const PAY_OPTIONS = [
  ["card", "Student ID Card", "Tap on bus reader · Visa / Touch 'n Go", "id-card"],
  ["qr",   "New Student",     "MAE / Touch 'n Go QR Payment · Scan Bus QR", "scan-line", "Available to new students for up to 30 days"],
];
function PaymentCard({ pay, setPay, openScan, paid }) {
  return html`
  <div className="m-4 mb-3 bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
    <div className="flex items-center gap-2 mb-3"><${Icon} n="credit-card" s=${18} c="text-slate-700"/><h2 className="font-semibold text-slate-900 text-sm">Payment method</h2></div>
    ${PAY_OPTIONS.map(([k, title, sub, icon, note]) => html`
      <button key=${k} onClick=${() => { setPay(k); if (k === "qr") openScan(); }}
        className=${"w-full flex items-center gap-3 p-3 mb-2 last:mb-0 rounded-xl border-2 text-left transition " + (pay === k ? "border-blue-600 bg-blue-50" : "border-slate-200")}>
        <span className=${"w-9 h-9 rounded-lg flex items-center justify-center " + (pay === k ? "bg-blue-600 text-white" : "bg-slate-100 text-slate-500")}><${Icon} n=${icon} s=${18}/></span>
        <span className="flex-1"><span className="block text-sm font-semibold text-slate-900">${title}</span><span className="block text-xs text-slate-500">${sub}</span>${note && html`<span className="block text-[11px] text-blue-600 mt-0.5">${note}</span>`}</span>
        <span className=${"w-5 h-5 rounded-full border-2 flex items-center justify-center " + (pay === k ? "border-blue-600" : "border-slate-300")}>${pay === k && html`<span className="w-2.5 h-2.5 rounded-full bg-blue-600"></span>`}</span>
      </button>`)}
    ${pay === "qr" && html`<button onClick=${openScan} className="mt-2 w-full text-xs font-semibold text-blue-600 flex items-center justify-center gap-1">
      <${Icon} n=${paid ? "check-circle-2" : "scan-line"} s=${14}/> ${paid ? "Paid · scan again" : "Scan Bus QR"}</button>`}
  </div>`;
}

/* 4. Gamified rewards */
function RewardsCard({ points, redeem }) {
  const pct = Math.min(100, points / REDEEM_COST * 100);
  return html`
  <div className="mx-4 mb-4 rounded-2xl p-4 text-white shadow-md bg-gradient-to-br from-amber-500 to-orange-600">
    <div className="flex items-center justify-between">
      <div><p className="text-xs opacity-90">Off-peak Rewards</p><p className="text-3xl font-extrabold">${points} <span className="text-sm font-semibold opacity-90">pts</span></p></div>
      <${Icon} n="gift" s=${34} c="opacity-90"/>
    </div>
    <div className="mt-3 h-2 rounded-full bg-white/30 overflow-hidden"><div className="h-full bg-white rounded-full transition-all" style=${{ width: pct + "%" }}></div></div>
    <p className="text-xs mt-1.5 opacity-90">${points >= REDEEM_COST ? "You can redeem a free drink!" : `${REDEEM_COST - points} pts to a free drink · Ride Route C off-peak for 2× points`}</p>
    <button onClick=${redeem} disabled=${points < REDEEM_COST} className="mt-3 w-full bg-white text-orange-600 font-bold text-sm rounded-xl py-2.5 flex items-center justify-center gap-2 disabled:opacity-60">
      <${Icon} n="coffee" s=${16}/> Redeem at Campus Cafe · ${REDEEM_COST} pts
    </button>
  </div>`;
}

const CANCEL_RULE = "Cancellation available until 5 minutes before departure.";

/* 2. Seat reservation bottom sheet (+ confirmation state) */
function ReserveSheet({ sel, setSel, seats, eta, status, booking, pay, paid, reserve, cancel, close, openScan, tapCard, canCancel, minsLeft }) {
  const R = ROUTES[sel];
  const closed = eta < BOOKING_CUTOFF;
  const payLabel = pay === "qr" ? "Scan Bus QR (MAE / Touch 'n Go)" : "Student ID Card";
  return html`
  <div className="absolute inset-0 z-20 bg-slate-900/40 flex items-end" onClick=${close}>
    <div className="sheet bg-white w-full rounded-t-3xl p-5 pb-6" onClick=${e => e.stopPropagation()}>
      <div className="w-10 h-1 bg-slate-300 rounded-full mx-auto mb-4"></div>
      ${booking ? html`
        <div className="text-center">
          <div className="w-14 h-14 rounded-full bg-emerald-100 text-emerald-600 mx-auto flex items-center justify-center mb-3"><${Icon} n="check-circle-2" s=${30}/></div>
          <h3 className="text-xl font-bold text-slate-900">Seat Reserved Successfully</h3>
          <p className="text-sm text-slate-500 mb-4">${ROUTES[booking.route].name} — ${ROUTES[booking.route].label}</p>
          <div className="bg-slate-50 rounded-xl px-4 py-1 mb-3 text-left text-sm">
            ${[["Bus", booking.bus], ["Seat", "#" + booking.seat], ["Arrival", booking.eta === 0 ? "At stop" : booking.eta + " min"]].map(([a, b]) => html`
              <div key=${a} className="flex justify-between py-2 border-b border-slate-200 last:border-0"><span className="text-slate-500">${a}</span><span className="font-bold text-slate-900">${b}</span></div>`)}
            <div className="flex justify-between py-2 gap-3"><span className="text-slate-500">Payment</span>
              <span className="font-bold text-slate-900 text-right">${paid ? "Paid ✓" : "Pay when boarding with " + payLabel}</span></div>
          </div>
          ${pay === "card" && !paid && html`<button onClick=${tapCard} className="w-full mb-3 py-2.5 rounded-xl bg-blue-50 text-blue-700 font-semibold text-sm flex items-center justify-center gap-2"><${Icon} n="id-card" s=${16}/> Simulate Student ID tap on bus reader</button>`}
          ${pay === "qr" && !paid && html`<button onClick=${openScan} className="w-full mb-3 py-2.5 rounded-xl bg-blue-50 text-blue-700 font-semibold text-sm flex items-center justify-center gap-2"><${Icon} n="scan-line" s=${16}/> Scan Bus QR to pay</button>`}
          <p className=${"text-[11px] mb-4 " + (canCancel ? "text-slate-500" : "text-amber-600")}>${cancelNote(canCancel, minsLeft, paid)}</p>
          <div className="flex gap-2">
            <button onClick=${cancel} disabled=${!canCancel} className="flex-1 py-3 rounded-xl border border-red-200 text-red-600 font-semibold text-sm disabled:opacity-40 disabled:cursor-not-allowed disabled:border-slate-200 disabled:text-slate-400">Cancel trip</button>
            <button onClick=${close} className="flex-1 py-3 rounded-xl bg-slate-900 text-white font-semibold text-sm">Done</button>
          </div>
        </div>` : html`
        <h3 className="text-lg font-bold text-slate-900 mb-3">Reserve a seat</h3>
        <div className="grid grid-cols-3 gap-2 mb-4">
          ${Object.entries(ROUTES).map(([k, r]) => html`
            <button key=${k} onClick=${() => setSel(k)} className=${"rounded-xl p-2.5 border-2 text-left transition " + (sel === k ? "bg-slate-50" : "border-slate-200")} style=${sel === k ? { borderColor: r.color } : {}}>
              <span className="block text-xs font-bold" style=${{ color: r.color }}>${r.name}</span>
              <span className="block text-sm font-bold text-slate-900">${seats[k]}/30</span>
              <span className="block text-[10px] text-slate-500">seats free</span>
            </button>`)}
        </div>
        <div className="mb-4">
          <div className="flex justify-between items-center text-xs text-slate-500 mb-1">
            <span className="flex items-center gap-1.5">${R.bus} · <span className=${"text-[10px] font-bold px-1.5 py-0.5 rounded-full " + status.cls}>${status.label}</span> ${eta > 0 ? eta + " min" : ""}</span>
            <span className="font-semibold text-slate-800">${seats[sel]} of 30 available</span></div>
          <div className="h-2 rounded-full bg-slate-100 overflow-hidden"><div className="h-full rounded-full" style=${{ width: seats[sel] / 30 * 100 + "%", background: R.color }}></div></div>
        </div>
        ${sel === "C" && html`<p className="text-xs bg-emerald-50 text-emerald-700 rounded-lg px-3 py-2 mb-3 flex items-center gap-1.5"><${Icon} n="sparkles" s=${14}/> Off-peak ride: earn +${OFF_PEAK_BONUS} points after you board and pay</p>`}
        ${closed && html`<p className="text-xs bg-amber-50 text-amber-700 rounded-lg px-3 py-2 mb-3 flex items-center gap-1.5"><${Icon} n="clock" s=${14}/> Reservations close 5 minutes before departure. Please choose another bus.</p>`}
        <button onClick=${reserve} disabled=${seats[sel] < 1 || closed} className="w-full py-3.5 rounded-2xl text-white font-semibold disabled:opacity-50" style=${{ background: R.color }}>Reserve seat on ${R.name}</button>
        <p className="text-[11px] text-slate-400 text-center mt-2">${CANCEL_RULE}</p>`}
    </div>
  </div>`;
}

/* 5. My Trips: upcoming + previous bookings (FR-08) */
function TripsSheet({ booking, paid, canCancel, minsLeft, cancel, close }) {
  const row = (key, r, bus, when, status, tone) => html`
    <div key=${key} className="flex items-center gap-3 p-3 mb-2 rounded-xl bg-slate-50">
      <span className="w-9 h-9 rounded-lg flex items-center justify-center text-white font-bold text-sm" style=${{ background: ROUTES[r].color }}>${r}</span>
      <span className="flex-1"><span className="block text-sm font-semibold text-slate-900">${ROUTES[r].name} — ${bus}</span><span className="block text-xs text-slate-500">${when}</span></span>
      <span className=${"text-[11px] font-semibold px-2 py-1 rounded-full " + tone}>${status}</span>
    </div>`;
  return html`
  <div className="absolute inset-0 z-20 bg-slate-900/40 flex items-end" onClick=${close}>
    <div className="sheet bg-white w-full rounded-t-3xl p-5 pb-6" onClick=${e => e.stopPropagation()}>
      <div className="w-10 h-1 bg-slate-300 rounded-full mx-auto mb-4"></div>
      <h3 className="text-lg font-bold text-slate-900 mb-3">My Trips</h3>
      <p className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Upcoming</p>
      ${booking
        ? row("up", booking.route, booking.bus, "Today " + booking.time + " · Seat #" + booking.seat, paid ? "Paid" : "Reserved", paid ? "bg-emerald-100 text-emerald-700" : "bg-blue-100 text-blue-700")

      ${booking && html`<div className="mb-2">
        <button onClick=${cancel} disabled=${!canCancel} className="w-full py-2.5 rounded-xl border border-red-200 text-red-600 font-semibold text-sm disabled:opacity-40 disabled:cursor-not-allowed disabled:border-slate-200 disabled:text-slate-400">Cancel trip</button>
        <p className=${"text-[11px] mt-1 text-center " + (canCancel ? "text-slate-500" : "text-amber-600")}>${cancelNote(canCancel, minsLeft, paid)}</p>

      <button onClick=${close} className="mt-3 w-full py-3 rounded-xl bg-slate-900 text-white font-semibold text-sm">Close</button>
    </div>
  </div>`;
}

/* 6. Simulated "Scan Bus QR" payment (UC-01 alternative flow, steps 9-13) */
function ScanModal({ step, bus, simulate, close }) {
  return html`<${Modal} onClose=${step === "check" ? () => {} : close}>
    ${step === "scan" && html`<div>
      <h3 className="font-bold text-slate-900 text-lg">Scan Bus QR Code</h3>
      <p className="text-xs text-slate-500 mb-4">Point your camera at the MAE / Touch 'n Go QR displayed inside the bus.</p>
      <div className="relative w-52 h-52 mx-auto rounded-2xl bg-slate-900 flex items-center justify-center overflow-hidden">
        <div className="w-36 h-36 bg-white rounded-lg p-2 flex items-center justify-center"><${QR} cls="w-full h-full"/></div>
        <span className="absolute top-2 left-2 w-6 h-6 border-t-4 border-l-4 border-emerald-400 rounded-tl-lg"></span>
        <span className="absolute top-2 right-2 w-6 h-6 border-t-4 border-r-4 border-emerald-400 rounded-tr-lg"></span>
        <span className="absolute bottom-2 left-2 w-6 h-6 border-b-4 border-l-4 border-emerald-400 rounded-bl-lg"></span>
        <span className="absolute bottom-2 right-2 w-6 h-6 border-b-4 border-r-4 border-emerald-400 rounded-br-lg"></span>
        <span className="scanline"></span>
      </div>
      <p className="text-[11px] text-slate-400 mt-2">Bus ${bus} · Simulated camera view</p>
      <button onClick=${simulate} className="mt-4 w-full py-3 rounded-xl bg-blue-600 text-white font-semibold text-sm flex items-center justify-center gap-2"><${Icon} n="scan-line" s=${16}/> Simulate Scan</button>
      <button onClick=${close} className="mt-2 w-full py-2 text-sm font-semibold text-slate-500">Cancel</button>
    </div>`}
    ${step === "check" && html`<div className="py-8">
      <div className="w-12 h-12 mx-auto rounded-full border-4 border-slate-200 border-t-blue-600 animate-spin mb-4"></div>
      <h3 className="font-bold text-slate-900">Validating payment…</h3>
      <p className="text-xs text-slate-500">Checking QR with MAE / Touch 'n Go</p>
    </div>`}
    ${step === "done" && html`<div>
      <div className="w-16 h-16 rounded-full bg-emerald-100 text-emerald-600 mx-auto flex items-center justify-center mb-3"><${Icon} n="check-circle-2" s=${34}/></div>
      <h3 className="font-bold text-slate-900 text-xl">Payment Successful</h3>
      <p className="text-sm text-slate-500 mt-1">Bus ${bus}</p>
      <p className="text-sm text-slate-500 mb-3">Payment confirmed</p>
      <div className="inline-flex items-center gap-2 bg-emerald-600 text-white font-extrabold tracking-widest rounded-full px-4 py-1.5 text-sm"><${Icon} n="volume-2" s=${16}/> BEEP</div>
      <p className="text-[11px] text-slate-400 mt-2">The driver hears the beep and sees you as “Boarded”.</p>
      <button onClick=${close} className="mt-4 w-full py-3 rounded-xl bg-slate-900 text-white font-semibold text-sm">Done</button>
    </div>`}
  <//>`;
}

</script>
  <script>
/* Root component: owns state and wires sections together */
function App() {
  const [now, setNow] = useState(0);
  const [sel, setSel] = useState("A");
  const [sheet, setSheet] = useState(false);
  const [trips, setTrips] = useState(false);
  const [seats, setSeats] = useState(INITIAL_SEATS);
  const [booking, setBooking] = useState(null);
  const [pay, setPay] = useState("card");
  const [scan, setScan] = useState(null);        // null | "scan" | "check" | "done"
  const [paid, setPaid] = useState(false);
  const [points, setPoints] = useState(380);
  const [voucher, setVoucher] = useState(null);
  const [toast, setToast] = useState("");

  useEffect(() => {                       // animation clock for the buses
    let id; const loop = t => { setNow(t); id = requestAnimationFrame(loop); };
    id = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(id);
  }, []);

  const eta = Math.max(0, Math.round((1 - busProgress(sel, 0, now)) * 9));
  const status = etaStatus(eta);
  const minsLeft = booking ? booking.eta - (now - booking.bookedAt) / SIM_MIN_MS : 0;   // minutes until this trip departs
  const canCancel = !!booking && !paid && minsLeft >= BOOKING_CUTOFF;

  function reserve() {
    if (seats[sel] < 1 || eta < BOOKING_CUTOFF) return;   // business rule: close 5 min before departure
    const seat = 30 - seats[sel] + 1;
    const d = new Date(Date.now() + eta * 60000);
    const time = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
    setSeats({ ...seats, [sel]: seats[sel] - 1 });
    setBooking({ route: sel, bus: ROUTES[sel].bus, seat, eta, time, bookedAt: now });
    setPaid(false);
  }
  function cancel() {
    if (!canCancel) return;               // rule: only until 5 min before departure
    setSeats(s => ({ ...s, [booking.route]: s[booking.route] + 1 }));
    setBooking(null);
    setPaid(false);
  }
  function redeem() {
    if (points < REDEEM_COST) return;
    setPoints(p => p - REDEEM_COST);
    setVoucher("CAFE-" + Math.random().toString(36).slice(2, 7).toUpperCase());
  }
  function completePayment() {            // boarding + payment confirmed -> off-peak reward is earned here
    beep(true);
    if (booking && !paid && booking.route === "C") {
      setPoints(p => p + OFF_PEAK_BONUS);
      setToast(`+${OFF_PEAK_BONUS} off-peak points earned!`);
      setTimeout(() => setToast(""), 2600);
    }
    setPaid(true);
  }
  function simulateScan() {               // NFR-04: QR validation within 3 s
    setScan("check");
    setTimeout(() => { completePayment(); setScan("done"); }, 900);
  }
  function tapCard() {                    // NFR-03: card tap confirmed within 1 s
    completePayment();
    setToast("Payment successful · BEEP");
    setTimeout(() => setToast(""), 2000);
  }

  const busNo = booking ? booking.bus : ROUTES[sel].bus;

  return html`
  <div className="h-full flex items-center justify-center p-2">
    <div className="phone relative w-full max-w-[400px] bg-slate-50 rounded-[2.5rem] shadow-2xl overflow-hidden border-[8px] border-slate-900 flex flex-col">

      <div className="px-5 pt-5 pb-3 flex items-center justify-between bg-white">
        <div><p className="text-xs text-slate-500">Good morning 👋</p><h1 className="text-lg font-bold text-slate-900 leading-tight">Where to today?</h1></div>
        <div className="flex items-center gap-1.5 bg-amber-100 text-amber-700 rounded-full px-3 py-1.5 text-sm font-semibold"><${Icon} n="coins" s=${16}/>${points}</div>
      </div>

      <div className="flex-1 overflow-y-auto pb-24">
        <${MapCard} sel=${sel} setSel=${setSel} now=${now} eta=${eta} status=${status}/>
        <${PaymentCard} pay=${pay} setPay=${setPay} openScan=${() => setScan("scan")} paid=${paid}/>
        <${RewardsCard} points=${points} redeem=${redeem}/>
      </div>

      ${!sheet && !trips && html`
        <div className="absolute bottom-0 inset-x-0 p-4 bg-gradient-to-t from-slate-50 via-slate-50 to-transparent flex gap-2">
          <button onClick=${() => setTrips(true)} className="shrink-0 bg-white text-slate-800 border border-slate-200 rounded-2xl px-4 py-3.5 font-semibold flex items-center justify-center gap-1.5 shadow-lg">
            <${Icon} n="history" s=${18}/> My Trips
          </button>
          <button onClick=${() => setSheet(true)} className="flex-1 bg-slate-900 text-white rounded-2xl py-3.5 font-semibold flex items-center justify-center gap-2 shadow-lg">
            <${Icon} n="armchair" s=${18}/> ${booking ? "View my reservation" : "Reserve a seat"}
          </button>
        </div>`}

      ${sheet && html`<${ReserveSheet} sel=${sel} setSel=${setSel} seats=${seats} eta=${eta} status=${status} booking=${booking} pay=${pay} paid=${paid}
        reserve=${reserve} cancel=${cancel} close=${() => setSheet(false)} openScan=${() => setScan("scan")} tapCard=${tapCard} canCancel=${canCancel} minsLeft=${minsLeft}/>`}

      ${trips && html`<${TripsSheet} booking=${booking} paid=${paid} canCancel=${canCancel} minsLeft=${minsLeft} cancel=${cancel} close=${() => setTrips(false)}/>`}

      ${scan && html`<${ScanModal} step=${scan} bus=${busNo} simulate=${simulateScan} close=${() => setScan(null)}/>`}

      ${voucher && html`<${Modal} onClose=${() => setVoucher(null)}>
        <div className="w-14 h-14 rounded-full bg-amber-100 text-amber-600 mx-auto flex items-center justify-center mb-3"><${Icon} n="coffee" s=${28}/></div>
        <h3 className="font-bold text-slate-900 text-lg">Voucher unlocked</h3>
        <p className="text-xs text-slate-500 mb-3">Show this at Campus Cafe</p>
        <div className="font-mono text-2xl font-bold tracking-widest bg-slate-50 border-2 border-dashed border-slate-300 rounded-xl py-3">${voucher}</div>
        <button onClick=${() => setVoucher(null)} className="mt-4 w-full py-3 rounded-xl bg-slate-900 text-white font-semibold text-sm">Done</button>
      <//>`}

      ${toast && html`<div className="absolute top-20 inset-x-0 z-40 flex justify-center"><div className="bg-emerald-600 text-white text-sm font-semibold px-4 py-2 rounded-full shadow-lg">${toast}</div></div>`}
    </div>
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);

</script>
</body>
</html>
